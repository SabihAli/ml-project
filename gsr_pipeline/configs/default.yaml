# Default configuration for gsr_pipeline

detector:
  # The 2-class athlete/ball detector (gsr_pipeline/detect_athlete.py), per the 2026-09-23
  # decision in docs/path_b/DETECTOR_AND_DATA_BLOCKERS.md. It emits no roles: `live_roles`
  # below recovers player/goalkeeper/referee and teams from kit colour. (Path A's 4-class
  # YOLOv8n is in archive/path_a/ since 2026-10-25.)
  onnx_path: "runs/yolo26s_athlete_ball/best_736x1280.onnx"
                           # 736x1280 is 16:9 at stride 32; a 1280x1280 square would pad
                           # ~44% wasted compute. best_1280x1280.onnx is also exported, for
                           # the parity gate's square-vs-rectangular A/B (plan 3.4).
  athlete_conf: 0.25       # people recall/precision 96.2% / 94.3% on SNGS-021 open play
  ball_conf: 0.15          # deliberately lower: the ball is the weakest class and every
                           # ball-based event depends on it. 0.15 gives 78.6% / 71.3%
                           # open-play recall/precision; 0.25 trades recall for precision.
  device: "cuda:0"         # ignored on the CPU tier
  backend: null            # null walks the fallback chain (tensorrt -> ort_gpu -> ort_cpu).
                           # Pin a tier only to debug or to force the degraded path; a
                           # pinned tier that is unavailable raises instead of falling back.
  batch_size: 8
  auto_build_engine: true  # build the TensorRT engine next to the ONNX on first launch (or
                           # whenever the engine file is missing); takes minutes, once per
                           # host. false: no engine means falling back to ONNX Runtime.
  # NMS iou (0.7) and max_det (300) are NOT set here. They come from the ONNX sidecar,
  # which carries the training config's values -- keeping them in one place stops the
  # runtime and the parity gate's reference from drifting apart (plan 3.5).

ball_specialist:
  # The temporal ball specialist c5c (gsr_pipeline/ball_specialist.py). Runs only on frames
  # the detector missed the ball, on a 640x640 window at the last sighting, frames t-2..t.
  # Test sequences: ball recall 59.4% -> 69.5%, precision 85.3% -> 86.5% (PERF_LOG 2026-10-16).
  enabled: true
  onnx_path: "runs/ball_temporal/c5c/ball_specialist_c5c.onnx"
  threshold: null          # null = the sidecar's 0.70, chosen on `select` and frozen for the
                           # test gate. Changing it changes the measured trade-off.
  max_miss_frames: 15      # frames since the last sighting it still runs (what gate 3 measured)
  device: "cuda:0"         # ignored on the CPU tier
  backend: null            # null walks tensorrt -> ort_gpu -> ort_cpu, like `detector`
  auto_build_engine: true  # build the TensorRT engine next to the ONNX on first launch

reid:
  # OSNet embeddings. Only the batch path's `refiner` uses them (merging tracklets), so the
  # model is loaded only when refiner.enabled is true. Teams come from `live_roles`.
  model_name: "osnet_x0_25"
  weights_path: null       # null uses torchreid market1501 pretrained weights
  device: "cpu"
  batch_size: 32

tracker:
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.8

calibration:
  checkpoint_kp: "data/pretrained_models/calibration/SV_kp"
  checkpoint_l: "data/pretrained_models/calibration/SV_lines"
  image_width: 1920
  image_height: 1080
  device: "cpu"
  use_prev_homography: true
  # NBJW forward backend: torch (eager, the accuracy reference) | auto | tensorrt | ort_gpu
  # | ort_cpu. Non-torch backends need the ONNX from scripts/export_nbjw.py; `auto` tries a
  # TensorRT engine next to the ONNX, then ORT GPU, then torch.
  backend: "torch"
  onnx_kp: "data/pretrained_models/calibration/nbjw_kp_540x960.onnx"
  onnx_l: "data/pretrained_models/calibration/nbjw_lines_540x960.onnx"
  fp16: false                 # torch backend on CUDA only: autocast FP16
  auto_build_engine: true     # tensorrt/auto backends: build the NBJW engines next to the ONNX
                              # on first launch (or whenever an engine file is missing); takes
                              # minutes, once per host. Irrelevant for backend: torch.
  fast_decode: true           # gsr_pipeline/nbjw_fast_decode.py: same keypoints as the vendored
                              # decode, faster (separable max-pool, no Python loops). false =
                              # the reference, for parity checks (scripts/parity_pipeline.py).
  # heuristic_voting: 18 cv2.calibrateCamera fits per NBJW run, used only to fill
  # predictions.json's camera_parameters passthrough (never for projection). Off unless
  # something needs camera intrinsics.
  compute_cam_params: false
  # Run full NBJW every K frames and propagate H by camera motion in between
  # (calibration_live.py). 1 + inline = per-frame NBJW, the accuracy reference.
  # Choose K against per-frame NBJW on GSR valid (plan section 7.3: largest K whose pitch
  # error stays within 0.5 m of K=1). 5: SNGS-021, 0.58 m vs GT (K=1: 0.59), 0.18 m vs per-frame NBJW.
  calib_every_k: 5
  mode: "inline"              # inline | async (NBJW on a background thread)
  max_h_age_frames: 50        # force an NBJW run when the anchor is older than this
  min_inlier_ratio: 0.5       # camera-motion RANSAC inliers below this break propagation
  max_zoom_change: 0.15       # re-run NBJW once zoom since the anchor exceeds +-15%
  min_trigger_interval_frames: 3  # at most one NBJW run per 3 frames for event triggers
                              # (no_motion, low_inliers, chain_broken, zoom, max_age); stops
                              # NBJW running every frame where it keeps failing (close-ups,
                              # replays). 1 = no limit. first / scene_cut / every_k exempt.
  motion:                     # CameraMotionEstimator
    work_width: 640
    max_corners: 400
    ransac_px: 2.0
    min_tracked: 30
    scene_cut_hist_corr: 0.6

jersey:
  gpu: false               # Set true if easyocr can use GPU
  batch_size: 8

refiner:
  enabled: false           # batch only. Needs ReID embeddings, which the measured Path B
                           # pipeline does not compute (notebooks/path_b_eval.py runs without
                           # it); true loads OSNet and runs split/merge/interpolate.
  speed_threshold: 10.0
  reid_threshold: 0.3
  interpolation_limit: 15

output:
  save_video: true
  save_json: true

possession:
  # Rule-based possession/turnover assignment (gsr_pipeline/possession.py).
  # Operates on pitch-plane (x, y) coordinates only -- the pipeline has no
  # ball-height/z data (monocular homography assumes a ground plane), so
  # "nearest player to ball" is judged with an elliptical proximity zone
  # rather than a single radius: the pitch-width (y) axis is judged more
  # strictly than the pitch-length (x) axis, since y spans only ~68m vs
  # x's ~105m and a broadcast view reads y as the "vertical"/lateral axis.
  proximity_x_m: 3.0       # half-width of the proximity ellipse along pitch length (x)
  proximity_y_m: 1.5       # half-width of the proximity ellipse along pitch width (y)
  hold_frames_threshold: 20  # frames to hold the last possessor after ball leaves
                              # every player's proximity zone before declaring the
                              # ball "uncontrolled" (distinguishes a guided pass in
                              # transit from a genuinely loose ball) -- at the
                              # pipeline's assumed frame rate this is a duration in
                              # frames, not seconds; convert using the source video's
                              # actual fps when tuning

live_roles:
  # Roles + teams for the detector's `athlete` boxes (gsr_pipeline/live_roles.py), fitted
  # per match with `athlete_roles` below. Batch: fit on the first fit_frames frames, then a
  # vote per tracklet. Live: buffer until fit_frames, fit, then a running vote per track.
  fit_frames: 250              # 10 s at 25 fps, the window notebooks/path_b_eval.py measured
                               # (0 = whole sequence, batch only)
  refit_every_frames: 50       # live: after a failed fit (one kit visible), retry this much later
  max_buffer_frames: 1500      # live: buffer cap before the fit
  min_athletes_for_pitch_view: 4  # is_pitch_view on the wire: this many athletes with a pitch position

athlete_roles:
  # Kit-colour role + team classifier (gsr_pipeline/athlete_roles.py), driven by `live_roles`.
  # Values were tuned on ONE sequence (SNGS-021); on GT boxes over 3 sequences, role accuracy
  # 95.5% and team 98.2% (DETECTOR_AND_DATA_BLOCKERS.md §5).
  n_clusters: 6               # colour clusters before lighting-variant merging
  merge_dist: 25.0            # clusters closer than this (weighted Lab) are one kit in sun/shade;
                              # results were flat for 24-28 but 15-20 split a kit and mislabelled
                              # players as referees
  l_weight: 0.5               # luminance counts half as much as chroma (lighting varies mostly in L)
  team_min_per_frame: 2.5     # a team kit appears this many times per frame; keepers/officials do not
  gk_zone_m: 20.0             # a minor-colour person within this distance of a goal line is a keeper
  pitch_length_m: 105.0       # calibration's pitch template (see PIPELINE_EVOLUTION.md §7.12)
  pitch_width_m: 68.0
  offpitch_margin_x_m: 5.5    # beyond the pitch by this margin -> "other"
  offpitch_margin_y_m: 6.0    # (assistant referees walk the touchline, so y gets more room)
  random_state: 0

reid_worker_pool:
  # Background worker pool for jersey OCR in process_stream (live mode only -- the batch
  # path runs it inline). No ReID live: teams come from live_roles. See
  # gsr_pipeline/reid_worker_pool.py, docs/architecture/STREAMING_ARCHITECTURE.md §1.7.6.
  max_workers: 2               # concurrent appearance-extraction threads
  max_queue_size: 8            # in-flight job cap; a full queue DROPS the
                                # oldest-submitted job rather than blocking
                                # the fast per-frame loop (that frame's
                                # position/role events already went out
                                # regardless -- only team/jersey are late)

live_broadcast:
  # LiveBroadcastFrameSource (gsr_pipeline/frame_source.py) -- real RTMP/RTSP/HLS
  # reconnect-on-drop semantics, distinct from VideoFileFrameSource's "None means
  # sequence complete" behavior. See docs/architecture/STREAMING_ARCHITECTURE.md §1.2, §8 step 8.
  reconnect_max_attempts: 5      # after this many failed reconnect attempts in a
                                  # row, read_frame() gives up and returns None with
                                  # disconnect_reason="reconnect_attempts_exhausted"
  reconnect_backoff_base_s: 1.0  # first retry waits this long
  reconnect_backoff_max_s: 30.0  # backoff doubles each attempt, capped here
  read_timeout_s: 10.0           # bounds how long a single open()/read() call may
                                  # block on the network before OpenCV/FFmpeg gives
                                  # up -- best-effort, older builds may ignore this

frame_source:
  # FrameSource.validate() thresholds (FR-002 / docs/architecture/STREAMING_ARCHITECTURE.md
  # §1.4). Thresholds are explicitly provisional -- need tuning against real
  # broadcast footage, which doesn't exist in this repo yet.
  validation:
    max_frames: 30
    timeout_s: 10.0
    black_intensity_threshold: 10.0   # 0-255 scale
    frozen_diff_threshold: 1.0        # 0-255 scale, mean abs frame-to-frame diff

ws:
  # WS event feed tunables (api/event_broadcaster.py, docs/architecture/STREAMING_ARCHITECTURE.md §4).
  max_queue_size: 100   # bounded per-connection event queue; a full queue
                         # DROPS THE OLDEST queued event (same drop-oldest
                         # policy as reid_worker_pool's job queue) rather
                         # than blocking process_stream's frame loop or the
                         # WS consumer

streaming:
  # api/ layer tunables (docs/architecture/STREAMING_ARCHITECTURE.md §2-3).
  max_active_streams: 1        # enforces the v1 single-stream-at-a-time constraint
  process_stream_fps: 25.0     # passed to GSRPipeline.process_stream's `fps` arg
                                # (frame duration in the appearance-job context);
                                # not derived from the source's real frame rate yet
  log_progress_every_n_frames: 250  # aggregate progress logging cadence (avoids
                                     # per-frame log spam at streaming throughput)
