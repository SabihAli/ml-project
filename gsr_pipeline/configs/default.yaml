# Default configuration for gsr_pipeline

detector:
  model_path: "yolov8n_gsr.pt"  # Nano model (~6MB)
  conf_threshold: 0.25
  ball_conf_threshold: 0.15
  iou_threshold: 0.45
  device: "cpu"            # change to "cuda" if GPU available
  batch_size: 8

detector_b:
  # Path B's 2-class athlete/ball detector (gsr_pipeline/detect_athlete.py), per the
  # 2026-09-23 decision in docs/DETECTOR_AND_DATA_BLOCKERS.md. Separate from `detector`
  # above so Path A stays runnable as the baseline until Phase 9 removes it
  # (docs/path_b_implementation/IMPLEMENTATION_PLAN.md 12).
  #
  # Not yet wired into GSRPipeline -- used by evaluate_detection.py --path b. The live
  # pipeline picks it up in Phase 2.
  onnx_path: "model_testing/yolo26s_athlete_ball/best_736x1280.onnx"
                           # 736x1280 is 16:9 at stride 32; a 1280x1280 square would pad
                           # ~44% wasted compute. best_1280x1280.onnx is also exported, for
                           # the parity gate's square-vs-rectangular A/B (plan 3.4).
  athlete_conf: 0.25       # people recall/precision 96.2% / 94.3% on SNGS-021 open play
  ball_conf: 0.15          # deliberately lower: the ball is the weakest class and every
                           # ball-based event depends on it. 0.15 gives 78.6% / 71.3%
                           # open-play recall/precision; 0.25 trades recall for precision.
  device: "cuda:0"         # ignored on the CPU tier
  backend: null            # null walks the fallback chain (tensorrt -> ort_gpu -> ort_cpu).
                           # Pin a tier only to debug or to force the degraded path; a
                           # pinned tier that is unavailable raises instead of falling back.
  batch_size: 8
  # NMS iou (0.7) and max_det (300) are NOT set here. They come from the ONNX sidecar,
  # which carries the training config's values -- keeping them in one place stops the
  # runtime and the parity gate's reference from drifting apart (plan 3.5).

reid:
  model_name: "osnet_x0_25"
  weights_path: null       # null uses torchreid market1501 pretrained weights
  device: "cpu"
  batch_size: 32

tracker:
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.8

calibration:
  checkpoint_kp: "pretrained_models/calibration/SV_kp"
  checkpoint_l: "pretrained_models/calibration/SV_lines"
  image_width: 1920
  image_height: 1080
  device: "cpu"
  use_prev_homography: true

jersey:
  gpu: false               # Set true if easyocr can use GPU
  batch_size: 8

team:
  n_clusters: 3
  random_state: 0

refiner:
  enabled: true
  speed_threshold: 10.0
  reid_threshold: 0.3
  interpolation_limit: 15

output:
  save_video: true
  save_json: true
